<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<title>UMD · 质心点判断</title>
<style>
@font-face{font-family:UMD;src:url('fonts/centroid-ui.woff')}body{font:16px UMD,system-ui;margin:24px;color:#222;background:#fff;max-width:1700px}h1{font-size:24px}h2{font-size:20px;margin-top:28px}p{line-height:1.65}select,button{font:inherit;padding:6px;margin:4px}a{color:#245ca8}.note{color:#666;font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.inputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.panel{position:relative;overflow:hidden}.panel img{width:100%;display:block}.panel canvas{position:absolute;inset:0;width:100%;height:100%}figure{margin:0}figcaption{margin:8px 0}.inputs img{width:100%;height:320px;object-fit:contain}table{border-collapse:collapse;margin-top:14px}td,th{padding:8px 20px;border-bottom:1px solid #ddd;text-align:left}tr.selected{background:#eee}tbody tr{cursor:pointer}.legend span{display:inline-block;padding:4px 9px;margin:4px;font-size:14px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.inputs{grid-template-columns:1fr}}
</style>
<h1>UMD · 质心点判断</h1>
<p class="note">2,661 张测试图。候选 mask、原始模型和功能定义固定；每个候选独立输入三张图。下方展示实际输入。GT 仅用于评估。</p>
<select id="category"><option value="">全部物体类别</option></select><select id="sample"></select>
<button id="prev">上一张</button><button id="next">下一张</button><label><input id="crop" type="checkbox" checked>放大物体</label>
<div id="legend" class="legend"></div><div id="grid" class="grid"></div>
<p class="note">图上分数：该图 GT 已有功能的平均 IoU；总体七类 mIoU 见实验结果文档。</p>
<h2>本次判断的三张输入</h2><select id="candidate"></select><span id="choice"></span>
<div id="inputs" class="inputs"></div><p id="pointNote" class="note"></p><p id="links"></p>
<table><thead><tr><th>候选</th><th>原始填色判断</th><th>质心点判断</th><th>质心位于本 mask 内</th></tr></thead><tbody id="decisions"></tbody></table>
<script src="data.js"></script><script>
const data=window.CENTROID,$=id=>document.getElementById(id),names=['none','grasp','cut','scoop','contain','pound','support','wrap-grasp'],colors=[[0,0,0],[230,85,65],[65,120,230],[245,190,45],[60,180,95],[195,85,180],[45,190,200],[235,130,45]];let filtered=[];
for(const cat of [...new Set(data.items.map(x=>x.category))])$('category').add(new Option(cat,cat));
for(let k=1;k<8;k++){let s=document.createElement('span');s.style.background=`rgba(${colors[k]},0.5)`;s.textContent=names[k];$('legend').append(s)}
function current(){return filtered[+$('sample').value]}
function panel(label,rgb,mask){let f=document.createElement('figure'),cap=document.createElement('figcaption');cap.textContent=label;f.append(cap);let p=document.createElement('div');p.className='panel';let im=new Image();im.src=rgb;p.append(im);if(mask){let c=document.createElement('canvas');p.append(c);let m=new Image();m.onload=()=>{c.width=m.width;c.height=m.height;let ctx=c.getContext('2d');ctx.drawImage(m,0,0);let pix=ctx.getImageData(0,0,m.width,m.height);for(let i=0;i<pix.data.length;i+=4){let k=pix.data[i];if(k>0&&k<8){pix.data[i]=colors[k][0];pix.data[i+1]=colors[k][1];pix.data[i+2]=colors[k][2];pix.data[i+3]=140}else pix.data[i+3]=0}ctx.putImageData(pix,0,0)};m.src=mask}f.append(p);$('grid').append(f)}
function inputView(){let item=current(),c=item.candidates[+$('candidate').value];$('inputs').replaceChildren();for(const [i,src]of [...item.inputs,c.image].entries()){let f=document.createElement('figure'),cap=document.createElement('figcaption');cap.textContent=['1 · 原始 RGB 裁剪','2 · 全部候选编号（保持原样）','3 · RGB＋该候选质心点'][i];let a=document.createElement('a');a.href=src;a.target='_blank';let im=new Image();im.src=src;a.append(im);f.append(cap,a);$('inputs').append(f)}$('choice').textContent=`原始填色：${c.baseline} → 质心点：${c.prediction}`;$('pointNote').textContent=`原图质心坐标：(${c.xy_original.map(x=>x.toFixed(2)).join(', ')})；${c.inside_own_mask?'位于本 mask 内':'落在本 mask 外，未移回内部'}。预测类别赋回该候选的整个原 mask。`;$('links').replaceChildren();for(const [name,url]of [['完整实际 Prompt',c.prompt],['请求 JSON',c.request],['响应 JSON',c.response]]){let a=document.createElement('a');a.textContent=name;a.href=url;a.target='_blank';$('links').append(a,document.createTextNode('　'))}for(const [i,r]of [...$('decisions').children].entries())r.className=i===+$('candidate').value?'selected':''}
function show(){let item=current();$('grid').replaceChildren();panel('RGB · '+item.id,item.rgb);panel('UMD 原始 GT',item.rgb,item.gt);for(const [k,title]of [['baseline','原始填色'],['centroid','质心点']])panel(title+' · '+(item.scores[k]*100).toFixed(2)+'%',item.rgb,item.predictions[k]);let[x0,y0,x1,y1]=$('crop').checked?item.crop:[0,0,...item.size];for(const p of document.querySelectorAll('.panel')){p.style.aspectRatio=(x1-x0)+' / '+(y1-y0);for(const im of p.children){im.style.position='absolute';im.style.width=(100*item.size[0]/(x1-x0))+'%';im.style.height=(100*item.size[1]/(y1-y0))+'%';im.style.left=(-100*x0/(x1-x0))+'%';im.style.top=(-100*y0/(y1-y0))+'%'}}$('candidate').replaceChildren();$('decisions').replaceChildren();item.candidates.forEach((c,i)=>{$('candidate').add(new Option('候选 '+c.region_id,String(i)));let tr=document.createElement('tr');for(const text of [c.region_id,c.baseline,c.prediction,c.inside_own_mask?'是':'否']){let td=document.createElement('td');td.textContent=text;tr.append(td)}tr.onclick=()=>{$('candidate').value=String(i);inputView()};$('decisions').append(tr)});inputView()}
function filter(){filtered=data.items.filter(x=>!$('category').value||x.category==$('category').value);$('sample').replaceChildren();filtered.forEach((x,i)=>$('sample').add(new Option(x.id,String(i))));show()}
$('category').onchange=filter;$('sample').onchange=show;$('candidate').onchange=inputView;$('crop').onchange=show;
$('prev').onclick=()=>{$('sample').selectedIndex=($('sample').selectedIndex+filtered.length-1)%filtered.length;show()};$('next').onclick=()=>{$('sample').selectedIndex=($('sample').selectedIndex+1)%filtered.length;show()};filter();
</script></html>
